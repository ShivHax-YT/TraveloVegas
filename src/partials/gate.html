  <script>(function(){var r=document.documentElement,ok=false;try{ok=localStorage.getItem("tv-21")==="yes"}catch(e){}r.classList.add(ok?"is-21":"js-gate","is-locked");if(ok)r.classList.remove("is-locked")})();</script>

      <div class="gate-actions">

      <noscript><p class="gate-noscript">Turn on JavaScript to see the listings. The Nevada cannabis rules are below.</p></noscript>
