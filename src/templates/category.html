<!doctype html>
<html lang="en">
<head>
  {{head}}
</head>
<body>
  {{header}}
  {{gate}}

  <main id="main">
    <section class="cat-hero" aria-labelledby="cat-title">
      {{bandMedia}}
      <div class="cat-hero-copy wrap">
        <nav class="crumbs" aria-label="Breadcrumb">
          <ol role="list">
            <li><a href="{{home}}">Home</a></li>
            <li aria-current="page">{{crumb}}</li>
          </ol>
        </nav>
        <h1 class="cat-title" id="cat-title" tabindex="-1">{{h1}}</h1>
        <p class="cat-answer">{{answer}}</p>
      </div>
    </section>

    <div class="cat-body">
      <div class="wrap">
        {{extra}}
      </div>
      <section class="cat-list" aria-labelledby="list-title"{{listAttrs}}>
        <div class="wrap">
          <h2 class="list-title" id="list-title">{{listTitle}}</h2>
          {{jump}}
          {{chips}}
          <p class="cat-count" role="status" aria-live="polite">{{count}}</p>
          {{disclosure}}
          {{listing}}
        </div>
      </section>
    </div>
  </main>

  {{footer}}
</body>
</html>
